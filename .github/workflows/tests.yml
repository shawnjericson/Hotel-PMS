name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install display support for Tkinter tests
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xauth
      - name: Run all tests including desktop workflows
        run: xvfb-run -a python -m unittest discover -s tests -v
